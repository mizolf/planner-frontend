<button type="button" (click)="onClick()"
   class="group flex w-full h-full text-left bg-surface-container-lowest rounded-xl overflow-hidden hover:bg-surface-container-low transition-colors"
   style="box-shadow: 0 12px 40px rgba(32, 48, 68, 0.06);">

  <!-- Cover (left): placeholder gradient (no uploads) -->
  <div class="relative w-44 sm:w-52 shrink-0 min-h-[180px] bg-gradient-to-br from-primary/15 to-tertiary/15 flex flex-col items-center justify-center gap-2 p-4">
    <span class="material-symbols-outlined text-5xl text-primary/40">public</span>
    <span class="text-sm font-label font-semibold text-on-surface-variant text-center line-clamp-2">{{ trip().destination }}</span>
  </div>

  <!-- Content (right) -->
  <div class="flex-1 min-w-0 p-5 flex flex-col">
    <h3 class="text-lg font-bold font-headline text-on-surface truncate">{{ trip().name }}</h3>

    <!-- Destination -->
    <p class="flex items-center gap-1 text-sm text-on-surface-variant font-body mt-0.5">
      <span class="material-symbols-outlined text-[16px] shrink-0">location_on</span>
      <span class="truncate">{{ trip().destination }}</span>
    </p>

    <!-- Badges -->
    <div class="flex flex-wrap items-center gap-2 mt-3">
      <span class="inline-flex items-center gap-1 text-xs font-label px-2.5 py-1 rounded-full bg-secondary/10 text-secondary font-semibold">
        <span class="material-symbols-outlined text-[14px]">calendar_month</span>
        {{ 'EXPLORE.DAYS' | translate:{ count: trip().durationDays } }}
      </span>
      <span class="inline-flex items-center gap-1 text-xs font-label px-2.5 py-1 rounded-full bg-tertiary/10 text-tertiary font-semibold">
        <span class="material-symbols-outlined text-[14px]">groups</span>
        {{ 'EXPLORE.COMMUNITY.MEMBER_COUNT' | translate:{ count: trip().memberCount } }}
      </span>
    </div>

    <!-- Interest chips -->
    @if (trip().interests.length > 0) {
      <div class="flex flex-wrap gap-1.5 mt-3">
        @for (interest of trip().interests; track interest) {
          <span class="inline-flex text-xs font-label px-2.5 py-1 rounded-full bg-surface-container-low text-on-surface-variant font-medium">
            {{ 'TRIPS.INTERESTS.' + interest | translate }}
          </span>
        }
      </div>
    }

    <!-- Owner -->
    <div class="flex items-center gap-2 mt-auto pt-4">
      <div class="size-7 rounded-full bg-primary-container text-on-primary-container font-headline font-bold flex items-center justify-center text-xs shrink-0">
        {{ initialsOf(trip().ownerDisplayName) }}
      </div>
      <span class="text-sm font-label text-on-surface-variant truncate">
        {{ 'EXPLORE.COMMUNITY.BY_OWNER' | translate:{ name: trip().ownerDisplayName } }}
      </span>
    </div>
  </div>
</button>
