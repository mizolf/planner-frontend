<!-- relative + z-0 traps Leaflet's high internal z-indexes inside this stacking
     context, so they stay below page dialogs/modals (z-50). -->
<div class="relative z-0">
  <div
    #mapEl
    class="h-72 sm:h-96 w-full rounded-2xl overflow-hidden bg-surface-container-low"></div>

  @if (!hasLocations()) {
    <div
      class="absolute inset-0 flex flex-col items-center justify-center gap-2 px-6 text-center rounded-2xl bg-surface-container-low/85 pointer-events-none">
      <span class="material-symbols-outlined text-4xl text-on-surface-variant/40">location_off</span>
      <p class="text-sm font-label text-on-surface-variant">
        {{ 'TRIPS.DETAIL.MAP.NO_LOCATIONS' | translate }}
      </p>
    </div>
  }
</div>

@if (hasLocations() && hiddenCount() > 0) {
  <p class="mt-2 text-center text-xs font-label text-on-surface-variant/70">
    {{ 'TRIPS.DETAIL.MAP.HIDDEN_COUNT' | translate:{ count: hiddenCount() } }}
  </p>
}
