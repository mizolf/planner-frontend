<!-- Header -->
<header class="mb-10">
  <h2 class="text-on-surface font-headline text-4xl font-extrabold tracking-tight mb-2">{{ 'AUTH.LOGIN.TITLE' | translate }}</h2>
  <p class="text-on-surface-variant">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
</header>

<div class="space-y-6">
  <!-- Error Message -->
  @if (errorMessage()) {
    <div class="flex items-center gap-2 p-3 rounded-lg bg-error-container text-white font-medium text-sm">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ errorMessage()! | translate }}
    </div>
  }

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <app-form-field
      label="AUTH.COMMON.EMAIL_LABEL" icon="mail" type="email"
      controlName="email" placeholder="AUTH.COMMON.EMAIL_PLACEHOLDER"
      [errors]="{ required: 'AUTH.COMMON.EMAIL_REQUIRED', email: 'AUTH.COMMON.EMAIL_INVALID' }"
    />

    <app-password-field
      label="AUTH.COMMON.PASSWORD_LABEL" controlName="password" placeholder="AUTH.LOGIN.PASSWORD_PLACEHOLDER"
      [showForgotLink]="true"
      [errors]="{ required: 'AUTH.COMMON.PASSWORD_REQUIRED', minlength: 'AUTH.COMMON.PASSWORD_MINLENGTH' }"
    />

    <!-- Submit -->
    <button
      type="submit"
      [disabled]="loading()"
      class="w-full py-4 bg-primary text-on-primary font-headline font-bold rounded-lg shadow-[0_12px_40px_rgba(0,98,140,0.15)] hover:shadow-[0_12px_40px_rgba(0,98,140,0.25)] active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (loading()) {
        {{ 'AUTH.COMMON.LOADING' | translate }}
      } @else {
        {{ 'AUTH.LOGIN.SUBMIT' | translate }}
      }
    </button>
  </form>

  <!-- Register Link -->
  <div class="pt-6 text-center">
    <p class="text-sm text-on-surface-variant">
      {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}
      <a routerLink="/auth/register" class="text-primary font-bold hover:underline underline-offset-4 ml-1">{{ 'AUTH.LOGIN.CREATE_ACCOUNT_LINK' | translate }}</a>
    </p>
  </div>
</div>
