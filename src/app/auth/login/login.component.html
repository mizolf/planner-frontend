<!-- Header -->
<header class="mb-10">
  <h2 class="text-on-surface font-headline text-4xl font-extrabold tracking-tight mb-2">{{ 'AUTH.LOGIN.TITLE' | translate }}</h2>
  <p class="text-on-surface-variant">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
</header>

<div class="space-y-6">
  <!-- Google Sign-In -->
  <button
    type="button"
    (click)="onGoogleSignIn()"
    class="flex items-center justify-center gap-3 w-full py-3 px-4 bg-surface-container-lowest rounded-lg shadow-sm hover:bg-surface-container-high transition-colors text-sm font-medium text-on-surface-variant"
  >
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
    </svg>
    {{ 'AUTH.COMMON.GOOGLE_SIGNIN' | translate }}
  </button>

  <!-- Divider -->
  <div class="relative flex items-center justify-center">
    <div class="w-full border-t border-outline-variant/20"></div>
    <span class="absolute bg-surface px-4 text-xs font-label uppercase tracking-widest text-on-surface-variant/60">{{ 'AUTH.COMMON.DIVIDER' | translate }}</span>
  </div>

  <!-- Error Message -->
  @if (errorMessage()) {
    <div class="flex items-center gap-2 p-3 rounded-lg bg-error-container text-white font-medium text-sm">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ errorMessage()! | translate }}
    </div>
  }

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <app-form-field
      label="AUTH.COMMON.EMAIL_LABEL" icon="mail" type="email"
      controlName="email" placeholder="AUTH.COMMON.EMAIL_PLACEHOLDER"
      [errors]="{ required: 'AUTH.COMMON.EMAIL_REQUIRED', email: 'AUTH.COMMON.EMAIL_INVALID' }"
    />

    <app-password-field
      label="AUTH.COMMON.PASSWORD_LABEL" controlName="password" placeholder="AUTH.LOGIN.PASSWORD_PLACEHOLDER"
      [showForgotLink]="true"
      [errors]="{ required: 'AUTH.COMMON.PASSWORD_REQUIRED', minlength: 'AUTH.COMMON.PASSWORD_MINLENGTH' }"
    />

    <!-- Submit -->
    <button
      type="submit"
      [disabled]="loading()"
      class="w-full py-4 bg-primary text-on-primary font-headline font-bold rounded-lg shadow-[0_12px_40px_rgba(0,98,140,0.15)] hover:shadow-[0_12px_40px_rgba(0,98,140,0.25)] active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (loading()) {
        {{ 'AUTH.COMMON.LOADING' | translate }}
      } @else {
        {{ 'AUTH.LOGIN.SUBMIT' | translate }}
      }
    </button>
  </form>

  <!-- Register Link -->
  <div class="pt-6 text-center">
    <p class="text-sm text-on-surface-variant">
      {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}
      <a routerLink="/auth/register" class="text-primary font-bold hover:underline underline-offset-4 ml-1">{{ 'AUTH.LOGIN.CREATE_ACCOUNT_LINK' | translate }}</a>
    </p>
  </div>
</div>
