<div class="space-y-1.5">
  <label [for]="controlName()" class="block text-sm font-semibold text-on-surface-variant ml-1">
    {{ label() | translate }}
  </label>
  <div class="relative">
    <span class="material-symbols-outlined absolute left-4 top-3 text-on-surface-variant/40 text-lg">
      {{ icon() }}
    </span>
    <textarea
      [id]="controlName()"
      [formControlName]="controlName()"
      [placeholder]="placeholder() | translate"
      [rows]="rows()"
      class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/10 rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all shadow-sm outline-none resize-y"
    ></textarea>
  </div>
  @if (control?.touched && control?.errors) {
    <p class="text-xs text-error flex items-center gap-1 mt-1 ml-1">
      <span class="material-symbols-outlined text-[14px]">error</span>
      {{ firstErrorMessage | translate }}
    </p>
  }
</div>
