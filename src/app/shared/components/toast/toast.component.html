@if (toast(); as t) {
  <div class="fixed top-4 right-4 z-[60] flex items-center gap-3 px-5 py-3.5 rounded-card shadow-floating max-w-sm animate-slide-in"
       [ngClass]="t.type === 'success'
         ? 'bg-surface-container-lowest text-on-surface'
         : 'bg-error-container text-on-error-container'">
    <span class="material-symbols-outlined text-[20px]"
          [ngClass]="t.type === 'success' ? 'text-primary' : 'text-error'">
      {{ t.type === 'success' ? 'check_circle' : 'error' }}
    </span>
    <p class="text-sm font-label font-medium flex-1">{{ t.message | translate }}</p>
    @if (t.action; as a) {
      <button
        type="button"
        (click)="runAction(a.onClick)"
        class="text-sm font-label font-semibold text-primary hover:underline shrink-0">
        {{ a.label | translate }}
      </button>
    }
  </div>
}
