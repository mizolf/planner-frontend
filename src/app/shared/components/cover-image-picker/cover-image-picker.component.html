<div>
  <label class="block text-sm font-semibold text-on-surface-variant ml-1 mb-1.5">
    {{ label() | translate }}
  </label>

  <input
    #fileInput
    type="file"
    class="hidden"
    accept="image/jpeg,image/png,image/webp"
    [disabled]="disabled()"
    (change)="onFileSelected($event)" />

  @if (displayedUrl(); as url) {
    <div class="relative h-36 rounded-xl overflow-hidden">
      <img [src]="url" alt="" class="absolute inset-0 w-full h-full object-cover" />
    </div>

    <div class="flex items-center gap-2 mt-2">
      <button
        type="button"
        (click)="fileInput.click()"
        [disabled]="disabled()"
        [title]="'TRIPS.DETAIL.IMAGE.HINT' | translate"
        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg font-label text-sm font-semibold text-on-surface-variant hover:bg-surface-container-high transition-colors disabled:opacity-50">
        <span class="material-symbols-outlined text-[18px]">photo_camera</span>
        {{ 'TRIPS.DETAIL.IMAGE.CHANGE' | translate }}
      </button>
      <button
        type="button"
        (click)="onRemove()"
        [disabled]="disabled()"
        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg font-label text-sm font-semibold text-error hover:bg-error-container/40 transition-colors disabled:opacity-50">
        <span class="material-symbols-outlined text-[18px]">delete</span>
        {{ 'TRIPS.DETAIL.IMAGE.DELETE' | translate }}
      </button>
    </div>
  } @else {
    <button
      type="button"
      (click)="fileInput.click()"
      [disabled]="disabled()"
      class="w-full h-36 rounded-xl border-2 border-dashed border-outline-variant/60 flex flex-col items-center justify-center gap-1.5 text-on-surface-variant hover:border-primary hover:text-primary transition-colors disabled:opacity-50">
      <span class="material-symbols-outlined text-[28px]">add_photo_alternate</span>
      <span class="text-sm font-label font-semibold">{{ 'TRIPS.DETAIL.IMAGE.ADD' | translate }}</span>
      <span class="text-xs font-body">{{ 'TRIPS.DETAIL.IMAGE.HINT' | translate }}</span>
    </button>
  }

  @if (error(); as err) {
    <p class="text-xs text-error flex items-center gap-1 mt-1.5 ml-1">
      <span class="material-symbols-outlined text-[14px]">error</span>
      {{ err | translate }}
    </p>
  }
</div>
