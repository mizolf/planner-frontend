<div class="space-y-1.5">
  <label [for]="controlName()" class="block text-sm font-semibold text-on-surface-variant ml-1">
    {{ label() | translate }}
  </label>
  <div class="relative">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">
      {{ icon() }}
    </span>
    <input
      [id]="controlName()"
      [type]="type()"
      [formControlName]="controlName()"
      [placeholder]="placeholder() | translate"
      class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/10 rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all shadow-sm outline-none"
    />
  </div>
  @if (control?.touched && control?.errors) {
    <p class="text-xs text-error flex items-center gap-1 mt-1 ml-1">
      <span class="material-symbols-outlined text-[14px]">error</span>
      {{ firstErrorMessage | translate }}
    </p>
  }
</div>
