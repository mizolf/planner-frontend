<div class="space-y-1.5">
  <div class="flex justify-between items-center ml-1">
    <label [for]="controlName()" class="block text-sm font-semibold text-on-surface-variant">
      {{ label() | translate }}
    </label>
    @if (showForgotLink()) {
      <a class="text-xs font-label text-primary hover:text-primary-dim transition-colors" href="#">{{ 'AUTH.COMMON.FORGOT_PASSWORD' | translate }}</a>
    }
  </div>
  <div class="relative">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">
      lock
    </span>
    <input
      [id]="controlName()"
      [type]="showPassword() ? 'text' : 'password'"
      [formControlName]="controlName()"
      [placeholder]="placeholder() | translate"
      class="w-full pl-12 pr-12 py-3 bg-surface-container-lowest rounded-md focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all shadow-sm outline-none"
    />
    <button
      type="button"
      (click)="showPassword.set(!showPassword())"
      class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 hover:text-on-surface-variant transition-colors"
    >
      <span class="material-symbols-outlined text-lg">
        {{ showPassword() ? 'visibility_off' : 'visibility' }}
      </span>
    </button>
  </div>
  @if (control?.touched && control?.errors) {
    <p class="text-xs text-error flex items-center gap-1 mt-1 ml-1">
      <span class="material-symbols-outlined text-[14px]">error</span>
      {{ firstErrorMessage | translate }}
    </p>
  }
</div>
